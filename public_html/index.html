<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Enrollment Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 3.4.1 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="page-header text-center">
            <h2>Enrollment Form</h2>
        </div>

        <form id="stdForm">
            <div class="form-group">
                <label for="stdId">Roll-No:</label>
                <input type="text" class="form-control" id="stdId" name="stdId" onchange="getEmp()" placeholder="Enter student Roll no." required>
            </div>

            <div class="form-group">
                <label for="stdName">Full-Name:</label>
                <input type="text" class="form-control" id="stdName" name="stdName" placeholder="Enter Full-Name">
            </div>

            <div class="form-group">
                <label for="stdClass">Class:</label>
                <input type="text" class="form-control" id="stdClass" name="stdClass" placeholder="Enter Your Class">
            </div>

            <div class="form-group">
                <label for="stddate">Birth-Date:</label>
                <input type="date" class="form-control" id="stddate" name="stddate">
            </div>

            <div class="form-group">
                <label for="stdadd">Address:</label>
                <input type="text" class="form-control" id="stdadd" name="stdadd" placeholder="Enter Your Address">
            </div>

            <div class="form-group">
                <label for="stdenroll">Enrollment-Date:</label>
                <input type="date" class="form-control" id="stdenroll" name="stdenroll">
            </div>

            <div class="form-group text-center">
                <button type="button" class="btn btn-primary btn-lg" id="save" onclick="saveData();" disabled>Save</button>
                <button type="button" class="btn btn-warning btn-lg" id="update" onclick="updateData();" disabled>Update</button>
                <button type="button" class="btn btn-default btn-lg" id="reset" onclick="resetForm();" disabled>Reset</button>
            </div>
        </form>
    </div>

    <!-- jQuery and Bootstrap 3.4.1 JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- JPDB and Custom Script -->
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
